# Regenerate the SDK from the spec a production release serves, test it, and open a PR.
#
# agentleFS/proof-of-concept-2's sdk-regen.yml dispatches this after promotion has moved
# production AND production serves the promoted build, so `spec:pull` reads that release's
# contract. Dispatching on a merge to main instead read the PREVIOUS release's spec, since main
# reaches production only through a release.
#
# It opens a PR rather than publishing: a spec change can rename or remove a method, and that
# is a public API change a person should see before it ships. Merging the PR and pushing a
# vX.Y.Z tag publishes through release.yml.
#
# A PR opened with GITHUB_TOKEN starts no workflow runs, so ci.yml never runs on it. This job
# therefore runs the same checks itself before opening it, and the PR says so.
name: Regenerate from a release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "The agentleFS release production serves (X.Y.Z)"
        required: true
      build:
        description: "The commit that release deployed; health must report it"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regenerate
  cancel-in-progress: false

env:
  FERN_VERSION: "5.98.3" # same pin as ci.yml and release.yml

jobs:
  regenerate:
    name: Regenerate, test, open a PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # Inputs are free text: they reach scripts through env, never the script body.
      - name: Check the inputs
        env:
          RELEASE: ${{ inputs.release }}
          BUILD: ${{ inputs.build }}
        run: |
          [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::release must be X.Y.Z, got '$RELEASE'"; exit 1; }
          [[ "$BUILD" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::build must be a full commit sha, got '$BUILD'"; exit 1; }

      - name: Install the Fern CLI
        run: bun add -g fern-api@${{ env.FERN_VERSION }} --registry https://registry.npmjs.org

      - name: Regenerate from the live spec
        run: bun run generate

      # Before the diff check, so a release that changed nothing the SDK exposes still proves
      # the SDK works against it. EXPECT_BUILD fails the run if production moved to another
      # build between the dispatch and the spec pull.
      - name: Tests, against the regenerated SDK and production
        env:
          EXPECT_BUILD: ${{ inputs.build }}
          AGENTLEFS_TOKEN: ${{ secrets.AGENTLEFS_TOKEN }}
        run: bun run test

      - name: Generated SDK compiles
        run: cd sdks/typescript && bun build --target=node index.ts --outfile /dev/null

      - name: Open a PR if the SDK changed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain sdks/)" ]; then
            echo "Release $RELEASE changes nothing in the SDK."
            exit 0
          fi
          branch="regenerate/$RELEASE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add sdks/
          git commit -m "Regenerate from agentleFS $RELEASE" -m "Spec served by production at build $BUILD."
          git push --force -u origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "The PR for $branch is open and now carries this regeneration."
            exit 0
          fi
          gh pr create --base main --head "$branch" \
            --title "Regenerate from agentleFS $RELEASE" \
            --body "$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
              "Generated from https://agentlefs.com/v1/openapi.yaml while production served release $RELEASE (build \`$BUILD\`)." \
              "The dispatching run already passed the tests, the live health check against that build, and the bundle check. ci.yml does not run on a PR opened by GITHUB_TOKEN; push any commit to this branch to start it." \
              "**Diff summary**" \
              "$(git --no-pager diff --stat HEAD~1 -- sdks/ | tail -20)")"
