# API promotion dispatches only after exhaustive CI and the final stable X.Y.Z release.
# Generate and validate before committing/tagging; bot tag pushes need an explicit dispatch.
name: Regenerate from a release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Final published API release (X.Y.Z); also the npm SDK version"
        required: true
      spec_gzip_base64:
        description: "Gzip/base64 OpenAPI snapshot extracted from the final API release commit"
        required: true
      spec_sha256:
        description: "SHA-256 of the uncompressed OpenAPI snapshot"
        required: true
      build:
        description: "The commit bound to the final published API release"
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: regenerate-${{ inputs.release }}
  cancel-in-progress: false
  queue: max

env:
  FERN_VERSION: "5.98.3"

jobs:
  regenerate:
    name: Generate, test, tag and request publication
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Validate release and check for a previously tested tag
        id: existing
        env:
          RELEASE: ${{ inputs.release }}
          BUILD: ${{ inputs.build }}
          SPEC_SHA256: ${{ inputs.spec_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/release_contract.py validate "$RELEASE" "$BUILD" "$SPEC_SHA256"
          if git show-ref --verify --quiet "refs/tags/$RELEASE"; then
            git show "$RELEASE:sdk-release.json" > /tmp/sdk-release.json
            python3 scripts/release_contract.py metadata "$RELEASE" "$BUILD" "$SPEC_SHA256" /tmp/sdk-release.json
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the Fern CLI
        if: steps.existing.outputs.exists != 'true'
        run: bun add -g fern-api@${{ env.FERN_VERSION }} --registry https://registry.npmjs.org
      - name: Generate from the immutable final API spec
        if: steps.existing.outputs.exists != 'true'
        env:
          SDK_VERSION: ${{ inputs.release }}
          SPEC_GZIP_BASE64: ${{ inputs.spec_gzip_base64 }}
          SPEC_SHA256: ${{ inputs.spec_sha256 }}
        run: |
          python3 scripts/release_contract.py unpack
          fern generate --local
          bun run scripts/write-package-json.ts
      - name: SDK contract tests and live health
        if: steps.existing.outputs.exists != 'true'
        env:
          AGENTLEFS_TOKEN: ${{ secrets.AGENTLEFS_TOKEN }}
        run: bun run test
      - name: Build and load the packed CJS and ESM package
        if: steps.existing.outputs.exists != 'true'
        run: bash scripts/check-package.sh
      - name: Commit the tested snapshot and tag its SDK version
        if: steps.existing.outputs.exists != 'true'
        env:
          RELEASE: ${{ inputs.release }}
          BUILD: ${{ inputs.build }}
          SPEC_SHA256: ${{ inputs.spec_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/release_contract.py write "$RELEASE" "$BUILD" "$SPEC_SHA256" sdk-release.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdks/ openapi/v1.yaml sdk-release.json
          if ! git diff --cached --quiet; then
            git commit -m "Release SDK $RELEASE from API build $BUILD"
          fi
          # The generated commit lives in its immutable release tag. Independent versions
          # never compete to overwrite main, and branch protection needs no exception.
          git tag "$RELEASE"
          git push origin "refs/tags/$RELEASE"
      - name: Publish through the npm trusted workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          BUILD: ${{ inputs.build }}
        run: |
          # GITHUB_TOKEN-created tags do not trigger push workflows. Explicit dispatch does.
          gh workflow run release.yml --ref "$RELEASE" -f dry_run=false -f release="$RELEASE" -f build="$BUILD"
          echo "Requested Release for @agentlefs/sdk@$RELEASE; verify that workflow to confirm npm publication." >> "$GITHUB_STEP_SUMMARY"
