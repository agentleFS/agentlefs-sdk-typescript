# This filename is pinned by npm trusted publishing: never rename it.
# No NPM_TOKEN: only release.yml receives OIDC publishing permission.
name: Release

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack, but do not publish"
        type: boolean
        default: true
      release:
        description: "Automatic publication: final API X.Y.Z release"
        required: false
      build:
        description: "Automatic publication: released API commit SHA"
        required: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-sdk-publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Test and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.5.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Validate the tagged release contract
        id: version
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          RELEASE: ${{ inputs.release }}
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
            bash scripts/check-release-snapshot.sh
            python3 scripts/release_contract.py validate "$version"
            recorded_build="$(python3 -c 'import json; print(json.load(open("sdk-release.json"))["build"])')"
            recorded_spec="$(python3 -c 'import json; print(json.load(open("sdk-release.json"))["spec_sha256"])')"
            python3 scripts/release_contract.py metadata "$version" "$recorded_build" "$recorded_spec" sdk-release.json
            python3 scripts/release_contract.py snapshot "$recorded_spec" openapi/v1.yaml
            echo "build=$recorded_build" >> "$GITHUB_OUTPUT"
            echo "spec_sha256=$recorded_spec" >> "$GITHUB_OUTPUT"
          elif [ "$DRY_RUN" = "true" ]; then
            version="$(node -p "require('./sdks/typescript/package.json').version")"
          else
            echo "::error::Publishing requires a final X.Y.Z SDK tag; branch dispatches can only dry run."
            exit 1
          fi
          if [ -n "$RELEASE$BUILD" ]; then
            [ "$version" = "$RELEASE" ]
            python3 scripts/release_contract.py metadata "$RELEASE" "$BUILD" "$recorded_spec" sdk-release.json
          fi
          # Ship the tested, committed snapshot, never regenerate from a newer live API.
          SDK_VERSION="$version" bun run scripts/write-package-json.ts
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$([ "$DRY_RUN" = "true" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - name: SDK tests
        env:
          AGENTLEFS_TOKEN: ${{ secrets.AGENTLEFS_TOKEN }}
        run: bun run test
      - name: Build and load the packed CJS and ESM package
        id: package
        run: bash scripts/check-package.sh
      - name: Publish or verify an identical already published version
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          if npm view "@agentlefs/sdk@$VERSION" dist.integrity --json > /tmp/npm-version.json 2>/tmp/npm-version-error.json; then
            python3 scripts/release_contract.py integrity "$TARBALL" /tmp/npm-version.json
            echo "Already published with the same artifact; resuming GitHub release."
          else
            # Only a confirmed absent version permits publishing. Network/auth failures fail.
            if ! python3 -c 'import json; assert json.load(open("/tmp/npm-version.json"))["error"]["code"] == "E404"'; then
              cat /tmp/npm-version-error.json
              exit 1
            fi
            if ! npm view @agentlefs/sdk dist-tags --json > /tmp/npm-tags.json; then
              python3 -c 'import json; assert json.load(open("/tmp/npm-tags.json"))["error"]["code"] == "E404"'
              echo '{}' > /tmp/npm-tags.json
            fi
            # This global queue serializes registry writes. A delayed older version gets
            # an immutable version tag without moving the package's latest tag backwards.
            npm_tag="$(python3 scripts/release_contract.py publish-tag "$VERSION" /tmp/npm-tags.json)"
            npm publish "$TARBALL" --access public --tag "$npm_tag"
          fi
      - name: Create or complete the GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --json tagName > /tmp/sdk-github-release.json; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "@agentlefs/sdk $VERSION" \
              --generate-notes --notes "Install with npm install @agentlefs/sdk@$VERSION. Generated and tested after the final API release."
          fi
          gh release upload "$GITHUB_REF_NAME" "$TARBALL" --clobber
      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH: ${{ steps.version.outputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            echo "Published or verified @agentlefs/sdk@$VERSION with the tested artifact: https://www.npmjs.com/package/@agentlefs/sdk/v/$VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dry run: tests, build and packed CJS/ESM checks passed; nothing published." >> "$GITHUB_STEP_SUMMARY"
          fi
